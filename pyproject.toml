[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-cv-accelerator"
version = "0.3.0"
description = "Fine-tune, evaluate, register and serve computer vision models on Databricks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# Runtime dependencies are intentionally minimal: torch, transformers, mlflow
# and friends ship with Databricks Runtime ML.  Only packages that are NOT on
# DBR ML are listed here, mirroring requirements_runtime.txt.
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pycocotools>=2.0.6",
    "torchmetrics>=1.0",
    "timm",
    "albumentations>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.1",
    "pytest-cov>=4.1.0",
    "torch>=2.0",
    "transformers>=4.44,<5",
    "mlflow>=2.9",
    "pillow>=9.0",
    "numpy>=1.24",
]

# Deliberately not installed as a distribution package. The importable name
# here is literally ``src``, which is far too generic to claim globally --
# installing this repo and the SLM accelerator into one environment would have
# them shadow each other. Code runs from a repo checkout instead: the job
# entry points put the project root on sys.path, and pytest does the same via
# the pythonpath setting below.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "hub: test requires network access to the HuggingFace Hub",
    "slow: test takes more than a few seconds",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
