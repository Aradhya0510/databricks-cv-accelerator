command: ["streamlit", "run", "app.py"]

env:
  - name: STREAMLIT_SERVER_HEADLESS
    value: "true"
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
  - name: STREAMLIT_SERVER_FILE_WATCHER_TYPE
    value: "none"
  # XSRF protection stays ON: this app launches training jobs, registers
  # models and creates serving endpoints, so it performs privileged state
  # changes on behalf of the signed-in user.
  - name: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
    value: "true"
  - name: STREAMLIT_SERVER_ENABLE_CORS
    value: "false"
